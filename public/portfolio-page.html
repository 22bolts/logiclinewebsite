<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080a0f;
      --surface: #0f1219;
      --surface2: #161b26;
      --border: rgba(255,255,255,0.07);
      --border-bright: rgba(255,255,255,0.14);
      --text: #e8eaf0;
      --muted: #6b7280;
      --accent: #c8f060;
      --accent2: #60c8f0;
      --accent3: #f060a8;
      --ff-display: 'Bebas Neue', sans-serif;
      --ff-body: 'DM Sans', sans-serif;
      --ff-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ff-body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── Video BG ── */
    #videoBg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #videoBg video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #videoBg video.active { opacity: 0.12; }
    #videoBg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, var(--bg) 100%);
    }

    /* ── Layout ── */
    #app { position: relative; z-index: 1; }

    /* ── Loading ── */
    #loading {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .loader-ring {
      width: 60px; height: 60px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-family: var(--ff-mono);
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* ── Error ── */
    #error-state {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 40px;
    }
    #error-state h2 { font-size: 24px; color: var(--text); }
    #error-state p { color: var(--muted); max-width: 400px; font-size: 15px; }
    .retry-btn {
      margin-top: 8px;
      padding: 10px 28px;
      background: transparent;
      border: 1px solid var(--border-bright);
      color: var(--text);
      border-radius: 40px;
      font-family: var(--ff-body);
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .retry-btn:hover { border-color: var(--accent); background: rgba(200,240,96,0.06); }

    /* ── Empty ── */
    #empty-state {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 40px;
    }
    #empty-state .empty-title {
      font-family: var(--ff-display);
      font-size: clamp(48px, 8vw, 80px);
      letter-spacing: 0.03em;
      line-height: 1;
      color: var(--text);
    }
    #empty-state p { color: var(--muted); max-width: 400px; }

    /* ── Scrollable content ── */
    #content { display: none; }

    /* ── Hero / Intro bar ── */
    .portfolio-hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 6vw 80px;
      position: relative;
    }
    .hero-eyebrow {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .hero-title {
      font-family: var(--ff-display);
      font-size: clamp(64px, 10vw, 130px);
      line-height: 0.92;
      letter-spacing: 0.02em;
      color: var(--text);
    }
    .hero-title span { color: var(--accent); }
    .hero-sub {
      margin-top: 24px;
      font-size: 18px;
      color: var(--muted);
      max-width: 480px;
      font-weight: 300;
    }
    .hero-scroll {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .scroll-line {
      width: 60px;
      height: 1px;
      background: var(--muted);
      animation: scrollPulse 2s ease-in-out infinite;
    }
    @keyframes scrollPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

    /* ── Nav dots ── */
    .nav-dots {
      position: fixed;
      right: 32px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .nav-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border-bright);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s, width 0.3s;
      border: none;
      padding: 0;
    }
    .nav-dot.active {
      background: var(--accent);
      width: 6px;
      transform: scale(1.6);
    }
    .nav-dot:hover { background: var(--text); }

    /* ── Project section ── */
    .project-section {
      min-height: 100vh;
      padding: 120px 6vw;
      display: flex;
      flex-direction: column;
      gap: 100px;
      border-top: 1px solid var(--border);
    }

    /* ── Project header ── */
    .proj-header {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 64px;
      align-items: start;
    }
    @media (max-width: 860px) {
      .proj-header { grid-template-columns: 1fr; gap: 40px; }
    }

    .proj-phone-wrap {
      position: relative;
    }
    .proj-phone {
      width: 100%;
      aspect-ratio: 9/16;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--border-bright);
      position: relative;
    }
    .proj-phone img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }
    .proj-phone:hover img { transform: scale(1.04); }
    .proj-phone-glow {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 60px;
      background: var(--accent);
      filter: blur(40px);
      opacity: 0.15;
      pointer-events: none;
    }

    .proj-info { padding-top: 16px; }

    .proj-index {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }
    .proj-title {
      font-family: var(--ff-display);
      font-size: clamp(52px, 7vw, 96px);
      line-height: 0.9;
      letter-spacing: 0.02em;
      color: var(--text);
      margin-bottom: 12px;
    }
    .proj-genre {
      font-family: var(--ff-mono);
      font-size: 13px;
      color: var(--accent2);
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }
    .proj-description {
      font-size: 17px;
      color: var(--muted);
      line-height: 1.75;
      max-width: 600px;
      font-weight: 300;
      margin-bottom: 32px;
    }

    /* ── Metrics row ── */
    .proj-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }
    .metric-pill {
      padding: 6px 16px;
      background: rgba(200,240,96,0.07);
      border: 1px solid rgba(200,240,96,0.2);
      border-radius: 40px;
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    /* ── Project meta ── */
    .proj-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 32px;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .meta-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: var(--ff-mono);
    }
    .meta-value {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
    }

    /* ── Platform buttons ── */
    .platform-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .platform-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-family: var(--ff-body);
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }
    .platform-btn:hover {
      border-color: var(--accent);
      background: rgba(200,240,96,0.05);
      transform: translateY(-2px);
    }
    .platform-btn img { width: 20px; height: 20px; filter: brightness(0) invert(1); }
    .platform-btn.github { border-color: rgba(96,200,240,0.3); }
    .platform-btn.github:hover { border-color: var(--accent2); background: rgba(96,200,240,0.05); }
    .platform-btn.demo { border-color: rgba(240,96,168,0.3); }
    .platform-btn.demo:hover { border-color: var(--accent3); background: rgba(240,96,168,0.05); }

    /* ── Features ── */
    .section-label {
      font-family: var(--ff-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .feature-card {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 4/3;
      cursor: pointer;
      text-decoration: none;
      display: block;
      border: 1px solid var(--border);
      transition: border-color 0.3s, transform 0.4s;
    }
    .feature-card:hover {
      border-color: var(--border-bright);
      transform: translateY(-4px);
    }
    .feature-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease, filter 0.6s ease;
      filter: saturate(0.4) brightness(0.6);
    }
    .feature-card:hover img {
      transform: scale(1.06);
      filter: saturate(0.7) brightness(0.7);
    }
    .feature-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8,10,15,0.95) 0%, rgba(8,10,15,0.3) 60%, transparent 100%);
    }
    .feature-body {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 20px 20px;
    }
    .feature-icon-wrap {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 10px;
      backdrop-filter: blur(8px);
    }
    .feature-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }
    .feature-desc {
      font-size: 13px;
      color: rgba(232,234,240,0.6);
      line-height: 1.5;
    }

    /* ── Technologies ── */
    .tech-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .tech-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      font-family: var(--ff-mono);
      transition: border-color 0.2s, background 0.2s;
    }
    .tech-tag:hover {
      border-color: var(--border-bright);
      background: var(--surface2);
    }
    .tech-icon { font-size: 18px; }

    /* ── Screenshots ── */
    .screenshots-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .screenshot-thumb {
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 9/16;
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: border-color 0.3s, transform 0.3s;
    }
    .screenshot-thumb:hover {
      border-color: var(--border-bright);
      transform: scale(1.02);
    }
    .screenshot-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.85);
      transition: filter 0.3s;
    }
    .screenshot-thumb:hover img { filter: brightness(1); }
    .screenshot-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 10px 12px;
      background: linear-gradient(to top, rgba(8,10,15,0.9), transparent);
      font-size: 12px;
      color: rgba(232,234,240,0.7);
      font-family: var(--ff-mono);
    }

    /* ── Section dividers ── */
    .proj-divider {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }
    .divider-line {
      height: 1px;
      background: var(--border);
    }

    /* ── Pagination ── */
    .pagination-bar {
      position: sticky;
      bottom: 0;
      z-index: 50;
      background: rgba(8,10,15,0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 16px 6vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .page-info {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .page-btns { display: flex; gap: 10px; }
    .page-btn {
      padding: 8px 24px;
      background: transparent;
      border: 1px solid var(--border-bright);
      border-radius: 40px;
      color: var(--text);
      font-family: var(--ff-body);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, opacity 0.2s;
    }
    .page-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(200,240,96,0.06);
    }
    .page-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .page-dots { display: flex; gap: 6px; align-items: center; }
    .page-dot-bar {
      width: 20px; height: 3px;
      background: var(--border-bright);
      border-radius: 2px;
      cursor: pointer;
      transition: width 0.3s, background 0.3s;
      border: none;
      padding: 0;
    }
    .page-dot-bar.active { width: 36px; background: var(--accent); }

    /* ── Animations ── */
    .fade-in {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .fade-in.visible { opacity: 1; transform: translateY(0); }
    .stagger-1 { transition-delay: 0.1s; }
    .stagger-2 { transition-delay: 0.2s; }
    .stagger-3 { transition-delay: 0.3s; }
    .stagger-4 { transition-delay: 0.4s; }
    .stagger-5 { transition-delay: 0.5s; }

    /* ── Featured badge ── */
    .featured-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(200,240,96,0.1);
      border: 1px solid rgba(200,240,96,0.3);
      border-radius: 40px;
      font-size: 11px;
      color: var(--accent);
      font-family: var(--ff-mono);
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
    .featured-dot {
      width: 5px; height: 5px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%,100%{ opacity:1; transform:scale(1); }
      50%{ opacity:0.5; transform:scale(0.6); }
    }

    /* ── Rating ── */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .stars { color: #f5c842; font-size: 14px; letter-spacing: 1px; }
    .rating-num { font-size: 14px; color: var(--text); font-weight: 500; }
    .rating-count { font-size: 13px; color: var(--muted); }

  </style>
</head>
<body>

<!-- Ambient video backgrounds -->
<div id="videoBg"></div>

<div id="app">
  <!-- Loading state -->
  <div id="loading">
    <div class="loader-ring"></div>
    <p class="loader-text">LOADING PROJECTS</p>
  </div>

  <!-- Error state -->
  <div id="error-state" style="display:none;">
    <h2>Failed to load portfolio</h2>
    <p id="error-msg">Could not reach the backend. Make sure the API server is running.</p>
    <button class="retry-btn" onclick="bootstrap()">Try again</button>
  </div>

  <!-- Empty state -->
  <div id="empty-state" style="display:none;">
    <div class="empty-title">NO PROJECTS<br><span style="color:var(--accent)">YET.</span></div>
    <p>Projects you publish will appear here.</p>
  </div>

  <!-- Main content -->
  <div id="content">
    <!-- Hero -->
    <section class="portfolio-hero fade-in">
      <p class="hero-eyebrow">Selected Work</p>
      <h1 class="hero-title">EVERY<br><span>CODE</span><br>A CRAFT</h1>
      <p class="hero-sub">Full-stack applications built with obsessive attention to detail.</p>
      <div class="hero-scroll">
        <div class="scroll-line"></div>
        SCROLL TO EXPLORE
      </div>
    </section>

    <!-- Projects injected here -->
    <div id="projects-container"></div>

    <!-- Pagination -->
    <div class="pagination-bar" id="pagination-bar" style="display:none;">
      <div class="page-dots" id="page-dots"></div>
      <span class="page-info" id="page-info"></span>
      <div class="page-btns">
        <button class="page-btn" id="prev-btn" onclick="changePage(-1)">← Prev</button>
        <button class="page-btn" id="next-btn" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </div>
</div>

<!-- Side nav dots (injected after render) -->
<div class="nav-dots" id="nav-dots"></div>

<script>
// ─── Config ────────────────────────────────────────────────────────────────
const API_BASE = 'http://localhost:3001/api/portfolios'; // update to your actual base URL
const PAGE_SIZE = 6;
const USER_ID = null; // null = all published, or set to a specific user id number

// ─── State ─────────────────────────────────────────────────────────────────
let allProjects = [];
let currentPage = 0;
let activeVideoSlot = null;
let videoElements = {};

// ─── Fetch ─────────────────────────────────────────────────────────────────
async function fetchPortfolios() {
  const params = new URLSearchParams({ status: 'published' });
  if (USER_ID) params.set('userId', USER_ID);

  const res = await fetch(`${API_BASE}?${params.toString()}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ─── Bootstrap ─────────────────────────────────────────────────────────────
async function bootstrap() {
  show('loading');
  try {
    allProjects = await fetchPortfolios();
  } catch (e) {
    // Fallback to demo data in dev/preview
    console.warn('API unavailable — using demo data', e);
    allProjects = getDemoData();
  }

  if (!allProjects.length) { show('empty-state'); return; }

  setupVideoBackgrounds();
  renderPage(0);
  show('content');
  requestAnimationFrame(() => {
    document.querySelector('.portfolio-hero')?.classList.add('visible');
    setupScrollObserver();
  });
}

// ─── Video backgrounds ──────────────────────────────────────────────────────
function setupVideoBackgrounds() {
  const bg = document.getElementById('videoBg');
  bg.innerHTML = '';
  const seen = new Set();
  allProjects.forEach(p => {
    if (!p.backgroundVideoUrl || seen.has(p.videoSlot || p.id)) return;
    const slot = p.videoSlot || `proj_${p.id}`;
    seen.add(slot);
    const vid = document.createElement('video');
    vid.loop = true; vid.muted = true; vid.playsInline = true;
    vid.dataset.slot = slot;
    const src = document.createElement('source');
    src.src = p.backgroundVideoUrl; src.type = 'video/mp4';
    vid.appendChild(src);
    bg.appendChild(vid);
    videoElements[slot] = vid;
  });
}

function switchVideo(slot) {
  if (activeVideoSlot === slot) return;
  Object.values(videoElements).forEach(v => {
    v.classList.remove('active');
    v.pause();
  });
  if (slot && videoElements[slot]) {
    videoElements[slot].classList.add('active');
    videoElements[slot].play().catch(() => {});
  }
  activeVideoSlot = slot;
}

// ─── Render ─────────────────────────────────────────────────────────────────
function renderPage(page) {
  currentPage = page;
  const start = page * PAGE_SIZE;
  const slice = allProjects.slice(start, start + PAGE_SIZE);
  const container = document.getElementById('projects-container');
  container.innerHTML = '';

  slice.forEach((proj, i) => {
    container.appendChild(buildProjectSection(proj, start + i));
  });

  renderNavDots(slice);
  renderPagination();

  if (slice[0]?.videoSlot) switchVideo(slice[0].videoSlot);

  requestAnimationFrame(() => {
    container.querySelectorAll('.fade-in').forEach(el => {
      setTimeout(() => el.classList.add('visible'), 100);
    });
  });
}

// ─── Build a project section ────────────────────────────────────────────────
function buildProjectSection(p, globalIdx) {
  const sec = document.createElement('section');
  sec.className = 'project-section';
  sec.id = `project-${p.id}`;
  sec.dataset.slot = p.videoSlot || `proj_${p.id}`;
  sec.dataset.index = globalIdx;

  const featuredBadge = p.featured
    ? `<div class="featured-badge"><div class="featured-dot"></div> FEATURED PROJECT</div>`
    : '';

  const ratingHtml = p.rating
    ? `<div class="rating-row">
        <span class="stars">${'★'.repeat(Math.round(p.rating))}${'☆'.repeat(5 - Math.round(p.rating))}</span>
        <span class="rating-num">${p.rating}</span>
        ${p.downloadCount ? `<span class="rating-count">· ${p.downloadCount} users</span>` : ''}
       </div>` : '';

  const metricsHtml = (p.metrics?.length)
    ? `<div class="proj-metrics fade-in stagger-3">
        ${p.metrics.map(m => `<span class="metric-pill">${m}</span>`).join('')}
       </div>` : '';

  const metaFields = [
    p.role     && { label: 'Role',     value: p.role },
    p.duration && { label: 'Duration', value: p.duration },
    p.teamSize && { label: 'Team',     value: `${p.teamSize} people` },
    p.client   && { label: 'Client',   value: p.client },
  ].filter(Boolean);

  const metaHtml = metaFields.length
    ? `<div class="proj-meta fade-in stagger-4">
        ${metaFields.map(f =>
          `<div class="meta-item">
            <span class="meta-label">${f.label}</span>
            <span class="meta-value">${f.value}</span>
           </div>`
        ).join('')}
       </div>` : '';

  const platformLinks = [
    ...(p.platforms || []).map(pl =>
      `<a href="${pl.url || '#'}" class="platform-btn" target="_blank" rel="noopener">
        ${pl.icon ? `<img src="${pl.icon}" alt="${pl.name}">` : ''}
        <span>${pl.name}</span>
       </a>`
    ),
    p.linkGitHub  ? `<a href="${p.linkGitHub}" class="platform-btn github" target="_blank" rel="noopener"><span>GitHub →</span></a>` : '',
    p.linkLiveDemo? `<a href="${p.linkLiveDemo}" class="platform-btn demo" target="_blank" rel="noopener"><span>Live Demo ↗</span></a>` : '',
  ].filter(Boolean).join('');

  const featuresHtml = (p.features?.length)
    ? `<div>
        <div class="proj-divider fade-in">
          <div class="divider-line"></div>
          <span class="section-label">Key Features</span>
        </div>
        <div class="features-grid fade-in stagger-1">
          ${p.features.map(f =>
            `<a href="#" class="feature-card" onclick="return false">
              ${f.image ? `<img src="${f.image}" alt="${f.title}" loading="lazy">` : ''}
              <div class="feature-overlay"></div>
              <div class="feature-body">
                <div class="feature-icon-wrap">${f.icon || '✦'}</div>
                <div class="feature-title">${f.title}</div>
                <div class="feature-desc">${f.description}</div>
              </div>
             </a>`
          ).join('')}
        </div>
       </div>` : '';

  const techHtml = (p.technologies?.length)
    ? `<div>
        <div class="proj-divider fade-in">
          <div class="divider-line"></div>
          <span class="section-label">Technologies</span>
        </div>
        <div class="tech-grid fade-in stagger-1">
          ${p.technologies.map(t =>
            `<div class="tech-tag">
              ${t.icon ? `<span class="tech-icon">${t.icon}</span>` : ''}
              <span>${t.name}</span>
             </div>`
          ).join('')}
        </div>
       </div>` : '';

  const screenshotsHtml = (p.screenshots?.length > 1)
    ? `<div>
        <div class="proj-divider fade-in">
          <div class="divider-line"></div>
          <span class="section-label">Screenshots</span>
        </div>
        <div class="screenshots-row fade-in stagger-1">
          ${[...p.screenshots].sort((a,b) => (a.order||0)-(b.order||0)).map(s =>
            `<div class="screenshot-thumb">
              <img src="${s.url}" alt="${s.caption || ''}" loading="lazy">
              ${s.caption ? `<div class="screenshot-caption">${s.caption}</div>` : ''}
             </div>`
          ).join('')}
        </div>
       </div>` : '';

  sec.innerHTML = `
    <div class="proj-header fade-in">
      <div class="proj-phone-wrap">
        <div class="proj-phone">
          ${p.coverImage ? `<img src="${p.coverImage}" alt="${p.title}">` : ''}
        </div>
        <div class="proj-phone-glow"></div>
      </div>
      <div class="proj-info">
        <div class="proj-index">/ ${String(globalIdx + 1).padStart(2, '0')}</div>
        ${featuredBadge}
        <h2 class="proj-title">${p.title.toUpperCase()}</h2>
        ${p.genre ? `<div class="proj-genre">${p.genre}</div>` : ''}
        ${ratingHtml}
        <p class="proj-description">${p.description}</p>
        ${metricsHtml}
        ${metaHtml}
        <div class="platform-btns fade-in stagger-5">${platformLinks}</div>
      </div>
    </div>

    ${featuresHtml}
    ${techHtml}
    ${screenshotsHtml}
  `;

  return sec;
}

// ─── Nav dots ────────────────────────────────────────────────────────────────
function renderNavDots(slice) {
  const nav = document.getElementById('nav-dots');
  nav.innerHTML = '';
  slice.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-dot' + (i === 0 ? ' active' : '');
    btn.title = p.title;
    btn.onclick = () => document.getElementById(`project-${p.id}`)?.scrollIntoView({ behavior: 'smooth' });
    nav.appendChild(btn);
  });
}

// ─── Pagination ──────────────────────────────────────────────────────────────
function renderPagination() {
  const totalPages = Math.ceil(allProjects.length / PAGE_SIZE);
  const bar = document.getElementById('pagination-bar');
  if (totalPages <= 1) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';

  document.getElementById('page-info').textContent =
    `${currentPage * PAGE_SIZE + 1}–${Math.min((currentPage + 1) * PAGE_SIZE, allProjects.length)} of ${allProjects.length}`;

  document.getElementById('prev-btn').disabled = currentPage === 0;
  document.getElementById('next-btn').disabled = currentPage >= totalPages - 1;

  const dots = document.getElementById('page-dots');
  dots.innerHTML = '';
  for (let i = 0; i < totalPages; i++) {
    const d = document.createElement('button');
    d.className = 'page-dot-bar' + (i === currentPage ? ' active' : '');
    d.onclick = () => goToPage(i);
    dots.appendChild(d);
  }
}

function changePage(dir) { goToPage(currentPage + dir); }

function goToPage(page) {
  const total = Math.ceil(allProjects.length / PAGE_SIZE);
  if (page < 0 || page >= total) return;
  renderPage(page);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => {
    document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
  }, 300);
}

// ─── Scroll observer (video switch + nav dots) ───────────────────────────────
function setupScrollObserver() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        // Video
        const slot = entry.target.dataset.slot;
        if (slot) switchVideo(slot);

        // Nav dots
        const idx = entry.target.dataset.index;
        const dots = document.querySelectorAll('.nav-dot');
        const pageIdx = parseInt(idx) - currentPage * PAGE_SIZE;
        dots.forEach((d, i) => d.classList.toggle('active', i === pageIdx));
      }

      // Fade-in children
      entry.target.querySelectorAll('.fade-in').forEach(el => {
        if (entry.isIntersecting) el.classList.add('visible');
      });
    });
  }, { threshold: 0.1, rootMargin: '-20% 0px -20% 0px' });

  document.querySelectorAll('.project-section').forEach(s => obs.observe(s));

  // Also observe hero
  const hero = document.querySelector('.portfolio-hero');
  if (hero) {
    new IntersectionObserver(([e]) => {
      if (e.isIntersecting) e.target.classList.add('visible');
    }).observe(hero);
  }
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function show(id) {
  ['loading','error-state','empty-state','content'].forEach(i => {
    const el = document.getElementById(i);
    if (el) el.style.display = i === id ? (i === 'content' ? 'block' : 'flex') : 'none';
  });
}
