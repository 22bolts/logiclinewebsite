<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .video-background video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .video-background video.active {
            opacity: 0.3;
        }

        main {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 80px 20px 100px;
        }

        .project-section {
            max-width: 1400px;
            margin: 0 auto 100px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .project-header {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 60px;
            margin-bottom: 60px;
        }

        .project-image {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .project-image img {
            width: 100%;
            height: 700px;
            object-fit: cover;
            display: block;
        }

        .project-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .project-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .project-genre {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 30px;
        }

        .project-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 40px;
        }

        .download-links {
            display: flex;
            gap: 20px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .section-title2 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-align: center;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .feature-card {
            position: relative;
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-10px);
        }

        .feature-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .feature-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.9) 100%);
        }

        .feature-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-content {
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 30px;
        }

        .feature-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .feature-description {
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.5;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .tech-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tech-icon {
            font-size: 1.5rem;
        }

        .view-details-btn {
            display: inline-block;
            margin: 0 auto;
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .view-details-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .development-process {
            margin-top: 60px;
        }

        .process-video {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 40px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .process-video video {
            width: 100%;
            display: block;
        }

        .process-writeup {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            border-left: 4px solid #667eea;
        }

        .process-writeup h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .process-writeup p {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 20px;
        }

        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 80px;
            padding: 40px;
        }

        .pagination-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .pagination-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination-info {
            font-size: 1.2rem;
            color: #888;
        }

        @media (max-width: 1024px) {
            .project-header {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .project-image img {
                height: 500px;
            }

            .project-title {
                font-size: 3rem;
            }
        }

        @media (max-width: 768px) {
            .project-section {
                padding: 30px;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .pagination-controls {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

            const pageProjects = projects.slice(startIndex, endIndex);

                                ${project.developmentProcess.writeup}
                            </div>

                    </div>
                </section>
            `).join('');

            updatePagination();
            setupIntersectionObserver();
        }

        function updatePagination() {
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderProjects();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderProjects();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function switchVideo(videoId) {
            if (currentVideo === videoId || !videos[videoId]) return;

            Object.values(videos).forEach(video => {
                video.classList.remove('active');
                video.pause();
            });

            videos[videoId].classList.add('active');
            videos[videoId].play();
            currentVideo = videoId;
        }

        function setupIntersectionObserver() {
            const sections = document.querySelectorAll('.project-section');
            
            const observerOptions = {
                threshold: 0,
                rootMargin: '-40% 0px -40% 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const videoId = entry.target.getAttribute('data-video');
                        switchVideo(videoId);
                    }
                });
            }, observerOptions);

            sections.forEach(section => {
                observer.observe(section);
            });
        }

        // Initialize
        videos[currentVideo].classList.add('active');
        videos[currentVideo].play();
        renderProjects();
    </script>
